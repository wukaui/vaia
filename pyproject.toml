[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiav"
version = "0.1.0"
description = "「第二意见」AI 恶意文件研判台 —— 只读、可解释、可回滚的恶意文件研判流水线"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# 运行期必装：只覆盖 CLI 扫描链路。装完 `aiav scan <路径>` 即可用。
dependencies = [
    "pydantic-ai-slim[openai]>=2.9,<3",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pefile>=2024.8.26",
    "yara-python>=4.5",
    "oletools>=0.60",
    "olefile>=0.47",
    "pypdf>=4.0",
    # token 计数（②层摘要预算闸 + 成本账）。没有它 `triage.count_tokens` 会退到
    # `len(text)//4` —— 中文实测低估约 3.6 倍（140 vs 实际 507），干净安装上预算闸会失效。
    # 2026-10-08 补进必装（此前一直靠本机偶然装了）。
    "tiktoken>=0.7",
    # `pdfid`（Didier Stevens）—— PDF **结构面**计数（对象数 / 流数 / /Encrypt / /ObjStm /
    # /JS / /OpenAction …）。用在②层最小摘要的 PDF 分支（`aiav/triage.py::_pdf_summary`）。
    # 为什么钉成**必装**而不是"可选加速"：摘要是喂给模型的**输入**，输入不同 → 分数不同。
    # 装了 pdfid 走 `engine=pdfid`、没装退到原始字节正则（`engine=raw`），两条路的
    # `PDF 明文关键字计数` 那一行**内容不一样** → 同一份样本在两种环境下会拿到不同分数。
    # 要么必装、要么不写进摘要，不能"有就用没有就退"（那是不可复现）。
    # 纯 Python、无依赖、13KB。
    "pdfid>=1.1.3",
    # PE Authenticode 验签（aiav/authenticode.py）。纯 Python，不依赖 Windows ——
    # 旧实现走 powershell.exe 验签会把样本递给 Defender，实测被吃掉 21 个。
    "asn1crypto>=1.5",
    "cryptography>=42",
    # 静态分析工具，必装（规则集/签名集另跑 `aiav capa-setup`）
    "flare-capa>=9.4",
    "flare-floss>=3.1",
    # Assemblyline（CybercentreCanada/assemblyline，MIT）—— **装包路线，不抄模型**。
    # 用它的 ODM 模型（报告结构校验）与计分语义（common/heuristics.py），
    # 适配层在 aiav/assemblyline_core/。依赖多、包大都不是问题；
    # 唯一红线是**不依赖它的平台**（MongoDB / ES / Redis / K8s）—— 见 tests/test_assemblyline_core.py。
    # 钉死版本：报告结构校验拿它当基准，上游改字段我们得知道。
    "assemblyline==4.7.4.20",
]

[project.optional-dependencies]
# 本地 Web UI（纯 Python，无前端构建链）
web = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8",
]

[project.scripts]
aiav = "aiav.cli:app"

[tool.setuptools.packages.find]
include = ["aiav*"]

[tool.setuptools.package-data]
aiav = [
    "data/rules/*.yar",
    "data/rules/*.yara",
    "data/known_bad_hashes.txt",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = "-m 'not integration'"
markers = [
    "integration: 需要真实 LLM API Key 的测试",
]
